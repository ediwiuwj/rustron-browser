[package]
name = "rustron-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rustron: navegador ligero para Linux (binario GTK4 + WebKitGTK)"

[dependencies]
rustron-adblock = { path = "../rustron-adblock" }
rustron-bridge = { path = "../rustron-bridge" }
rustron-config = { path = "../rustron-config" }
rustron-core = { path = "../rustron-core" }
rustron-engine = { path = "../rustron-engine" }
rustron-theme = { path = "../rustron-theme" }
gtk4 = { version = "0.10", features = ["v4_6"] }
webkit6 = "0.5"
ureq = "2"
serde_json = "1"
