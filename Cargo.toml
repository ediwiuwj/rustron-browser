[workspace]
resolver = "3"
members = [
    "crates/rustron-app",
    "crates/rustron-bridge",
    "crates/rustron-adblock",
    "crates/rustron-config",
    "crates/rustron-core",
    "crates/rustron-engine",
    "crates/rustron-host",
    "crates/rustron-prefs",
    "crates/rustron-store",
    "crates/rustron-theme",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92.0"
license = "MPL-2.0"
repository = "https://github.com/ediwiuwj/rustron-browser"

